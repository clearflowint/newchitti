version: "3.9"

services:
  fastapi-backend:
    build: ./backend
    container_name: clearflow-backend
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    networks:
      - clearflow-net

  vue-frontend:
    build: ./frontend
    container_name: clearflow-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - clearflow-net

  caddy:
    image: caddy:2-alpine
    container_name: clearflow-caddy
    restart: unless-stopped
    ports:
      - "3000:80"
    entrypoint:
      - sh
      - -c
      - |
        printf ':80 {\n  handle /api/* {\n    reverse_proxy fastapi-backend:8000\n  }\n  handle {\n    reverse_proxy vue-frontend:80\n  }\n  encode gzip\n}\n' > /tmp/Caddyfile
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - fastapi-backend
      - vue-frontend
    networks:
      - clearflow-net

networks:
  clearflow-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:

# NOTE: NocoDB is intentionally NOT included in this compose file — connect
# NOCODB_BASE_URL in .env to your own self-hosted or cloud NocoDB instance,
# built per docs/NOCODB_SCHEMA.md.
